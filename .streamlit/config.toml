[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false


[theme]
base = "light"
primaryColor = "#0284c7"
backgroundColor = "#a5d4f8"
secondaryBackgroundColor = "#cbe5fd"
textColor = "#0f172a"
