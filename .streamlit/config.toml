[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false


[theme]
base = "light"
primaryColor = "#0284c7"
backgroundColor = "#B0E0E6"
secondaryBackgroundColor = "#C2EAEF"
textColor = "#0f172a"
