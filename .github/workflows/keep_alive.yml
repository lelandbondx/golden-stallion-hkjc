name: Keep Render Alive

on:
  schedule:
    # Run every 5 minutes to keep Render container warm and responsive
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send fail-loud keep-alive health check to Render
        run: |
          curl -s -f -o /dev/null -w "Render Health HTTP %{http_code}\n" https://silks-ai.onrender.com/?health=1
