name: Keep Render Alive

on:
  schedule:
    # Run every 5 minutes to keep Render container warm and responsive
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Render
        run: |
          curl -s -I -o /dev/null -w "%{http_code}" https://silks-ai.onrender.com/
