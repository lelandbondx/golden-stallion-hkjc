name: Auto-Update Horse Database

on:
  schedule:
    # Run twice daily:
    # - 10:00 UTC (6:00 PM HKT) to capture overnight odds & initialize baseline
    # - 04:00 UTC (12:00 PM HKT) to capture any late-morning vet/gear/trial updates
    - cron: '0 4,10 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: auto-update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml html5lib

      - name: Build Historical Database & Features
        run: |
          python build_db.py
          python build_features.py
          python build_features_results.py

      - name: Sync All Telemetry (Trials, Profiles, Vet Records, Trackwork, Incidents, Precomputed Features)
        run: |
          python sync_offseason_data.py 150
          python initialize_baseline_odds.py

      - name: Train Model & Generate Live Predictions
        run: |
          python train_model.py
          python run_predictions.py

      - name: Commit and Push Changes to Render
        run: |
          git config --global user.name 'Golden Stallion Automator'
          git config --global user.email 'automator@golden-stallion.local'
          git add data/ model.joblib
          git diff --quiet && git diff --staged --quiet || (git pull origin main -X ours && git commit -m "Auto-update live models, trials, vet records, incident memory, odds, and predictions" && git push origin main)

      - name: Verify Live Render App Health
        run: |
          curl -s -f -o /dev/null -w "HTTP %{http_code}\n" https://silks-ai.onrender.com/?health=1
