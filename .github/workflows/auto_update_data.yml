name: Auto-Update Horse Database

on:
  schedule:
    # Run twice daily:
    # - 10:00 UTC (6:00 PM HKT) to capture overnight odds & initialize baseline
    # - 04:00 UTC (12:00 PM HKT) to capture any late-morning vet/gear/trial updates
    - cron: '0 4,10 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: auto-update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml html5lib pytest

      - name: Refresh Official HKJC Veterinary Records
        run: |
          python vet_records.py
          pytest tests/test_vet_records.py -q

      - name: Commit Veterinary Records Immediately
        run: |
          git config --global user.name 'Golden Stallion Automator'
          git config --global user.email 'automator@golden-stallion.local'
          git add data/vet_records.json data/declared_vet_records.json data/latest_horse_stats.csv data/pipeline_health.json data/health/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update official HKJC per-horse veterinary records"
            git pull --no-rebase origin main -X ours
            git push origin main
          fi

      - name: Sync All Telemetry (Trials, Profiles, Trackwork, Incidents, Precomputed Features)
        run: |
          python sync_offseason_data.py 200
          python initialize_baseline_odds.py

      - name: Train Model & Generate Live Predictions
        run: |
          python train_model.py
          python run_predictions.py

      - name: Run Unit Tests Before Final Commit
        run: |
          pytest tests/test_vet_records.py tests/test_tactical_engine.py -q

      - name: Commit and Push Changes to Render
        if: always()
        run: |
          git config --global user.name 'Golden Stallion Automator'
          git config --global user.email 'automator@golden-stallion.local'
          git add data/ model.joblib
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update live models, trials, vet records, incident memory, odds, and predictions"
            git pull --no-rebase origin main -X ours
            git push origin main
          fi

      - name: Verify Live Render App Health
        if: always()
        run: |
          curl -s -f -o /dev/null -w "HTTP %{http_code}\n" https://silks-ai.onrender.com/?health=1
